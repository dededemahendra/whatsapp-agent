name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          test "$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match $v"; exit 1; }
      - name: Check CHANGELOG.md has a dated section for the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading="$(awk -v prefix="## ${version} (" 'index($0, prefix) == 1 { print; exit }' CHANGELOG.md)"
          if [ -z "$heading" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## ${version} (<date>)' section for ${GITHUB_REF_NAME}. Add it, then tag again."
            exit 1
          fi
          case "$heading" in
            *"(unreleased)"*)
              echo "::error file=CHANGELOG.md::CHANGELOG.md still says '${heading}'. Replace (unreleased) with the release date, then tag again."
              exit 1
              ;;
          esac
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading="$(awk -v prefix="## ${version} (" 'index($0, prefix) == 1 { print; exit }' CHANGELOG.md)"
          if [ -z "$heading" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## ${version} (<date>)' section for ${GITHUB_REF_NAME}. Add it, then tag again."
            exit 1
          fi
          case "$heading" in
            *"(unreleased)"*)
              echo "::error file=CHANGELOG.md::CHANGELOG.md still says '${heading}'. Replace (unreleased) with the release date, then tag again."
              exit 1
              ;;
          esac
          awk -v heading="$heading" '
            found && /^## / { exit }
            found { print }
            $0 == heading { found = 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
